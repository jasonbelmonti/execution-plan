# Markdown-native checks for Execution Plan artifacts. Exact table schemas,
# relationships, lifecycle correlations, and ordered-route invariants are owned by
# scripts/validate-execution-plan.mjs.
syntaxVersion: markdown-engine.validation@v2
documentVersion: 1.0.0
rules:
  - id: frontmatter.shape
    select:
      target: document
    assert:
      frontmatterShape:
        presence: required
        fields:
          - field: title
            required: true
            valueType: string
            nonEmpty: true
          - field: plan_id
            required: true
            valueType: string
            nonEmpty: true
          - field: artifact_version
            required: true
            valueType: string
            nonEmpty: true
          - field: revision
            required: true
            valueType: string
            nonEmpty: true
          - field: created_at
            required: true
            valueType: string
            nonEmpty: true
          - field: updated_at
            required: true
            valueType: string
            nonEmpty: true
          - field: target_repo
            required: true
            valueType: string
            nonEmpty: true
          - field: target_worktree
            required: true
            valueType: string
            nonEmpty: true
          - field: target_branch
            required: true
            valueType: string
            nonEmpty: true
          - field: baseline_ref
            required: true
            valueType: string
            nonEmpty: true
          - field: source_contract
            required: true
            valueType: string
            nonEmpty: true
          - field: validation_profile
            required: true
            valueType: string
            nonEmpty: true

  - id: sections.required
    select:
      target: document
    assert:
      sectionsRequired:
        order: strict
        headings:
          - Plan Control
          - Source Contract
          - Outcome Anchors
          - Baseline Findings
          - Preconditions
          - Implementation Decisions
          - Execution Phases
          - Execution Route
          - Execution Actions
          - Change Footprint
          - Validation Gates
          - Failure and Replan Controls
          - Plan Readiness
          - Revision Log

  - id: unresolved-placeholders.excluded
    select:
      target: document
    assert:
      text:
        excludes:
          - "TBD"
          - "TODO"
          - "???"
          - "<plan-id>"
          - "<target-repo>"
          - "<target-worktree>"
          - "<source-contract>"
          - "replace-with-command"
          - "state the action"
          - "state the expected result"
