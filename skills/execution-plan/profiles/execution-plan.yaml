# Markdown-native checks for Execution Plan artifacts. This profile owns required
# frontmatter shape, exact type and artifact version, lifecycle-field and reserved
# metadata exclusions, exact table schemas, generic ID coverage, and table/row
# cardinality. Reference syntax, lifecycle correlations, and ordered-route
# invariants are owned by scripts/validate-execution-plan.mjs.
syntaxVersion: markdown-engine.validation@v2
documentVersion: 1.0.0
rules:
  - id: frontmatter.shape
    select:
      target: document
    assert:
      frontmatterShape:
        presence: required
        fields:
          - field: type
            required: true
            valueType: string
            equals: ExecutionPlan
          - field: title
            required: true
            valueType: string
            nonBlank: true
          - field: plan_id
            required: true
            valueType: string
            nonBlank: true
          - field: artifact_version
            required: true
            valueType: string
            equals: "2.0"
          - field: revision
            required: true
            valueType: string
            nonBlank: true
          - field: created_at
            required: true
            valueType: string
            nonBlank: true
          - field: updated_at
            required: true
            valueType: string
            nonBlank: true
          - field: target_repo
            required: true
            valueType: string
            nonBlank: true
          - field: target_worktree
            required: true
            valueType: string
            nonBlank: true
          - field: target_branch
            required: true
            valueType: string
            nonBlank: true
          - field: baseline_ref
            required: true
            valueType: string
            nonBlank: true
          - field: source_contract
            required: true
            valueType: string
            nonBlank: true
          - field: validation_profile
            required: true
            valueType: string
            nonBlank: true
          - field: status
            forbidden: true
          - field: planning_depth
            forbidden: true
          - field: okf_version
            forbidden: true

  - id: sections.required
    select:
      target: document
    assert:
      sectionsRequired:
        order: strict
        headings:
          - Plan Control
          - Source Contract
          - Outcome Anchors
          - Baseline Findings
          - Preconditions
          - Implementation Decisions
          - Execution Phases
          - Execution Route
          - Execution Actions
          - Change Footprint
          - Validation Gates
          - Failure and Replan Controls
          - Plan Readiness
          - Revision Log

  - id: tables.plan-control.columns
    select:
      target: table
      section: Plan Control
    assert:
      tableColumnsExact:
        columns:
          - Plan state
          - Planning depth
          - Source status
          - Baseline status
          - State rationale

  - id: tables.source-contract.columns
    select:
      target: table
      section: Source Contract
    assert:
      tableColumnsExact:
        columns:
          - Source ID
          - Source reference
          - Version / fingerprint
          - Authority
          - Status
          - Planning implication

  - id: tables.outcome-anchors.columns
    select:
      target: table
      section: Outcome Anchors
    assert:
      tableColumnsExact:
        columns:
          - Outcome ID
          - Source IDs
          - Source location
          - Required observable
          - Proof obligation

  - id: tables.baseline-findings.columns
    select:
      target: table
      section: Baseline Findings
    assert:
      tableColumnsExact:
        columns:
          - Finding ID
          - Repository evidence
          - Current behavior / constraint
          - Planning implication
          - Confidence

  - id: tables.preconditions.columns
    select:
      target: table
      section: Preconditions
    assert:
      tableColumnsExact:
        columns:
          - Precondition ID
          - Required state / input
          - Verification
          - Unmet trigger ID

  - id: tables.implementation-decisions.columns
    select:
      target: table
      section: Implementation Decisions
    assert:
      tableColumnsExact:
        columns:
          - Decision ID
          - Kind
          - Decision or assumption
          - Finding IDs
          - Evidence / rationale
          - Affected action IDs
          - Replan trigger ID

  - id: tables.execution-phases.columns
    select:
      target: table
      section: Execution Phases
    assert:
      tableColumnsExact:
        columns:
          - Phase ID
          - Phase objective
          - Entry precondition IDs
          - Safe intermediate state

  - id: tables.execution-route.columns
    select:
      target: table
      section: Execution Route
    assert:
      tableColumnsExact:
        columns:
          - Step ID
          - Kind
          - Phase ID
          - Required prior Step IDs

  - id: tables.execution-actions.columns
    select:
      target: table
      section: Execution Actions
    assert:
      tableColumnsExact:
        columns:
          - Action ID
          - Precondition IDs
          - Outcome IDs
          - Targets
          - Concrete action
          - Observable postcondition
          - Evidence to capture
          - Failure response ID

  - id: tables.change-footprint.columns
    select:
      target: table
      section: Change Footprint
    assert:
      tableColumnsExact:
        columns:
          - Path / component
          - Action IDs
          - Change type
          - Purpose
          - Confidence
          - Risk / ownership note

  - id: tables.validation-gates.columns
    select:
      target: table
      section: Validation Gates
    assert:
      tableColumnsExact:
        columns:
          - Gate ID
          - Outcome IDs
          - Command or check
          - Expected observation
          - Evidence capture
          - Evidence artifact
          - Evidence verification
          - Failure response ID

  - id: tables.failure-responses.columns
    select:
      target: table
      section: Failure and Replan Controls
      header:
        - Response ID
        - Trigger
        - Containment
        - Exact recovery / rollback procedure
        - Single restored safe state
        - Verification
        - Escalation trigger ID
    assert:
      tableColumnsExact:
        columns:
          - Response ID
          - Trigger
          - Containment
          - Exact recovery / rollback procedure
          - Single restored safe state
          - Verification
          - Escalation trigger ID

  - id: tables.replan-triggers.columns
    select:
      target: table
      section: Failure and Replan Controls
      header:
        - Trigger ID
        - Observable trigger
        - Stopped Step IDs
        - Evidence to preserve
        - Required decision / input
        - Exact resume condition
    assert:
      tableColumnsExact:
        columns:
          - Trigger ID
          - Observable trigger
          - Stopped Step IDs
          - Evidence to preserve
          - Required decision / input
          - Exact resume condition

  - id: tables.plan-readiness.columns
    select:
      target: table
      section: Plan Readiness
    assert:
      tableColumnsExact:
        columns:
          - Decision
          - Reviewed at
          - Evidence / rationale
          - Required revision or blocker

  - id: tables.revision-log.columns
    select:
      target: table
      section: Revision Log
    assert:
      tableColumnsExact:
        columns:
          - Revision
          - Timestamp
          - Actor
          - Material change
          - Reason / source
          - Checksum reference

  - id: tables.total.exact
    select:
      target: table
    assert:
      selectionCount: { min: 15, max: 15 }

  - id: rows.plan-control.count
    select:
      target: tableRow
      section: Plan Control
    assert:
      selectionCount: { min: 1, max: 1 }

  - id: rows.source-contract.count
    select:
      target: tableRow
      section: Source Contract
    assert:
      selectionCount: { min: 1, max: 30 }

  - id: rows.outcome-anchors.count
    select:
      target: tableRow
      section: Outcome Anchors
    assert:
      selectionCount: { min: 1, max: 20 }

  - id: rows.baseline-findings.count
    select:
      target: tableRow
      section: Baseline Findings
    assert:
      selectionCount: { min: 1, max: 30 }

  - id: rows.preconditions.count
    select:
      target: tableRow
      section: Preconditions
    assert:
      selectionCount: { min: 1, max: 30 }

  - id: rows.implementation-decisions.count
    select:
      target: tableRow
      section: Implementation Decisions
    assert:
      selectionCount: { min: 1, max: 30 }

  - id: rows.execution-phases.count
    select:
      target: tableRow
      section: Execution Phases
    assert:
      selectionCount: { min: 1, max: 12 }

  - id: rows.execution-route.count
    select:
      target: tableRow
      section: Execution Route
    assert:
      selectionCount: { min: 1, max: 100 }

  - id: rows.execution-actions.count
    select:
      target: tableRow
      section: Execution Actions
    assert:
      selectionCount: { min: 1, max: 60 }

  - id: rows.change-footprint.count
    select:
      target: tableRow
      section: Change Footprint
    assert:
      selectionCount: { min: 1 }

  - id: rows.validation-gates.count
    select:
      target: tableRow
      section: Validation Gates
    assert:
      selectionCount: { min: 1, max: 40 }

  - id: rows.failure-responses.count
    select:
      target: tableRow
      section: Failure and Replan Controls
      tableHeader:
        - Response ID
        - Trigger
        - Containment
        - Exact recovery / rollback procedure
        - Single restored safe state
        - Verification
        - Escalation trigger ID
    assert:
      selectionCount: { min: 1, max: 30 }

  - id: rows.replan-triggers.count
    select:
      target: tableRow
      section: Failure and Replan Controls
      tableHeader:
        - Trigger ID
        - Observable trigger
        - Stopped Step IDs
        - Evidence to preserve
        - Required decision / input
        - Exact resume condition
    assert:
      selectionCount: { min: 1, max: 30 }

  - id: rows.plan-readiness.count
    select:
      target: tableRow
      section: Plan Readiness
    assert:
      selectionCount: { min: 1, max: 1 }

  - id: rows.revision-log.count
    select:
      target: tableRow
      section: Revision Log
    assert:
      selectionCount: { min: 1 }

  - id: coverage.outcomes.execution-actions
    select:
      target: document
    assert:
      tableColumnCoverage:
        source:
          section: Outcome Anchors
          column: Outcome ID
          prefix: EP-OUT
        target:
          section: Execution Actions
          tableHeader:
            - Action ID
            - Precondition IDs
            - Outcome IDs
            - Targets
            - Concrete action
            - Observable postcondition
            - Evidence to capture
            - Failure response ID
          column: Outcome IDs
        require: everySourceId

  - id: coverage.outcomes.validation-gates
    select:
      target: document
    assert:
      tableColumnCoverage:
        source:
          section: Outcome Anchors
          column: Outcome ID
          prefix: EP-OUT
        target:
          section: Validation Gates
          tableHeader:
            - Gate ID
            - Outcome IDs
            - Command or check
            - Expected observation
            - Evidence capture
            - Evidence artifact
            - Evidence verification
            - Failure response ID
          column: Outcome IDs
        require: everySourceId

  - id: coverage.phases.execution-route
    select:
      target: document
    assert:
      tableColumnCoverage:
        source:
          section: Execution Phases
          column: Phase ID
          prefix: EP-PH
        target:
          section: Execution Route
          tableHeader:
            - Step ID
            - Kind
            - Phase ID
            - Required prior Step IDs
          column: Phase ID
        require: everySourceId

  - id: coverage.preconditions.execution-actions
    select:
      target: document
    assert:
      tableColumnCoverage:
        source:
          section: Preconditions
          column: Precondition ID
          prefix: EP-PRE
        target:
          section: Execution Actions
          tableHeader:
            - Action ID
            - Precondition IDs
            - Outcome IDs
            - Targets
            - Concrete action
            - Observable postcondition
            - Evidence to capture
            - Failure response ID
          column: Precondition IDs
        require: everySourceId

  - id: unresolved-placeholders.excluded
    select:
      target: document
    assert:
      text:
        excludes:
          - "TBD"
          - "TODO"
          - "???"
          - "<plan-id>"
          - "<target-repo>"
          - "<target-worktree>"
          - "<source-contract>"
          - "replace-with-command"
          - "state the action"
          - "state the expected result"
