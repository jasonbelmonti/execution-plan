syntaxVersion: markdown-engine.validation@v2
documentVersion: 1.0.0
rules:
  - id: frontmatter.required
    select:
      target: document
    assert:
      frontmatterRequired:
        fields:
          - title
          - plan_id
          - artifact_version
          - status
          - created_at
          - updated_at
          - target_repo
          - target_branch
          - source_packet
          - estimation_mode
          - validation_profile

  - id: sections.required
    select:
      target: document
    assert:
      sectionsRequired:
        order: strict
        headings:
          - Objective
          - Source Inventory
          - Planning Constraints
          - Target Completion Route
          - Execution Steps
          - File Touch Plan
          - Estimation Inputs
          - Validation Gates
          - Stop Conditions
          - Plan Viability Review
          - Plan Readiness Check
          - Review Handoff
          - Revision Log

  - id: source.inventory.table
    select:
      target: table
      section: Source Inventory
      header:
        - Source
        - Retrieved at
        - Authority
        - Status
        - Plan impact
    assert:
      tableColumnsRequired:
        columns:
          - Source
          - Retrieved at
          - Authority
          - Status
          - Plan impact

  - id: execution.steps.table
    select:
      target: table
      section: Execution Steps
      header:
        - Step
        - Action
        - Target
        - Depends on
        - Evidence
        - Stop condition
    assert:
      tableColumnsRequired:
        columns:
          - Step
          - Action
          - Target
          - Depends on
          - Evidence
          - Stop condition

  - id: file.touch.plan.table
    select:
      target: table
      section: File Touch Plan
      header:
        - Path
        - Change type
        - Purpose
        - Expected churn
        - Risk notes
    assert:
      tableColumnsRequired:
        columns:
          - Path
          - Change type
          - Purpose
          - Expected churn
          - Risk notes

  - id: estimation.inputs.table
    select:
      target: table
      section: Estimation Inputs
      header:
        - Field
        - Value
        - Notes
    assert:
      tableColumnsRequired:
        columns:
          - Field
          - Value
          - Notes

  - id: estimation.inputs.review-context-size.row
    select:
      target: tableRow
      section: Estimation Inputs
      tableHeader:
        - Field
        - Value
        - Notes
      where:
        column: Field
        equals: reviewContextSize
    assert:
      exists: true

  - id: estimation.inputs.review-context-size.allowed
    anyOf:
      - label: focused
        select:
          target: tableCell
          section: Estimation Inputs
          tableHeader:
            - Field
            - Value
            - Notes
          column: Value
          rowWhere:
            column: Field
            equals: reviewContextSize
        assert:
          text:
            contains: focused
            excludes:
              - standard
              - expanded
          textLength:
            min: 7
            max: 7
      - label: standard
        select:
          target: tableCell
          section: Estimation Inputs
          tableHeader:
            - Field
            - Value
            - Notes
          column: Value
          rowWhere:
            column: Field
            equals: reviewContextSize
        assert:
          text:
            contains: standard
            excludes:
              - focused
              - expanded
          textLength:
            min: 8
            max: 8
      - label: expanded
        select:
          target: tableCell
          section: Estimation Inputs
          tableHeader:
            - Field
            - Value
            - Notes
          column: Value
          rowWhere:
            column: Field
            equals: reviewContextSize
        assert:
          text:
            contains: expanded
            excludes:
              - focused
              - standard
          textLength:
            min: 8
            max: 8

  - id: validation.gates.table
    select:
      target: table
      section: Validation Gates
      header:
        - Gate
        - Command or check
        - Required evidence
        - Owner
    assert:
      tableColumnsRequired:
        columns:
          - Gate
          - Command or check
          - Required evidence
          - Owner

  - id: revision.log.table
    select:
      target: table
      section: Revision Log
      header:
        - Timestamp
        - Actor
        - Change
        - Artifact checksum reference
    assert:
      tableColumnsRequired:
        columns:
          - Timestamp
          - Actor
          - Change
          - Artifact checksum reference

  - id: plan.readiness.table
    select:
      target: table
      section: Plan Readiness Check
      header:
        - Check
        - Requirement
        - Evidence
        - Status
    assert:
      tableColumnsRequired:
        columns:
          - Check
          - Requirement
          - Evidence
          - Status

  - id: review.handoff.table
    select:
      target: table
      section: Review Handoff
      header:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
    assert:
      tableColumnsRequired:
        columns:
          - Review context packet
          - Task fit
          - Status
          - Packet contents

  - id: review.handoff.exact-column-count
    select:
      target: table
      section: Review Handoff
      header:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
    assert:
      textOccurrenceCount:
        text: "	"
        count: 12

  - id: review.handoff.focused.row
    select:
      target: tableRow
      section: Review Handoff
      tableHeader:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
      where:
        column: Review context packet
        equals: Focused
    assert:
      exists: true

  - id: review.handoff.standard.row
    select:
      target: tableRow
      section: Review Handoff
      tableHeader:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
      where:
        column: Review context packet
        equals: Standard
    assert:
      exists: true

  - id: review.handoff.expanded.row
    select:
      target: tableRow
      section: Review Handoff
      tableHeader:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
      where:
        column: Review context packet
        equals: Expanded
    assert:
      exists: true

  - id: review.handoff.exact-row-count
    select:
      target: table
      section: Review Handoff
      header:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
    assert:
      textOccurrenceCount:
        text: "\n"
        count: 3

  - id: review.handoff.focused-selected-when-focused
    when:
      select:
        target: tableCell
        section: Estimation Inputs
        tableHeader:
          - Field
          - Value
          - Notes
        column: Value
        rowWhere:
          column: Field
          equals: reviewContextSize
      assert:
        text:
          contains: focused
        textLength:
          min: 7
          max: 7
    select:
      target: tableCell
      section: Review Handoff
      tableHeader:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
      column: Status
      rowWhere:
        column: Review context packet
        equals: Focused
    assert:
      text:
        contains: SELECTED
      textLength:
        min: 8
        max: 8

  - id: review.handoff.omitted-when-focused
    when:
      select:
        target: tableCell
        section: Estimation Inputs
        tableHeader:
          - Field
          - Value
          - Notes
        column: Value
        rowWhere:
          column: Field
          equals: reviewContextSize
      assert:
        text:
          contains: focused
        textLength:
          min: 7
          max: 7
    allOf:
      - label: standard-omitted
        select:
          target: tableCell
          section: Review Handoff
          tableHeader:
            - Review context packet
            - Task fit
            - Status
            - Packet contents
          column: Status
          rowWhere:
            column: Review context packet
            equals: Standard
        assert:
          text:
            contains: OMITTED
          textLength:
            min: 7
            max: 7
      - label: expanded-omitted
        select:
          target: tableCell
          section: Review Handoff
          tableHeader:
            - Review context packet
            - Task fit
            - Status
            - Packet contents
          column: Status
          rowWhere:
            column: Review context packet
            equals: Expanded
        assert:
          text:
            contains: OMITTED
          textLength:
            min: 7
            max: 7

  - id: review.handoff.standard-selected-when-standard
    when:
      select:
        target: tableCell
        section: Estimation Inputs
        tableHeader:
          - Field
          - Value
          - Notes
        column: Value
        rowWhere:
          column: Field
          equals: reviewContextSize
      assert:
        text:
          contains: standard
        textLength:
          min: 8
          max: 8
    select:
      target: tableCell
      section: Review Handoff
      tableHeader:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
      column: Status
      rowWhere:
        column: Review context packet
        equals: Standard
    assert:
      text:
        contains: SELECTED
      textLength:
        min: 8
        max: 8

  - id: review.handoff.omitted-when-standard
    when:
      select:
        target: tableCell
        section: Estimation Inputs
        tableHeader:
          - Field
          - Value
          - Notes
        column: Value
        rowWhere:
          column: Field
          equals: reviewContextSize
      assert:
        text:
          contains: standard
        textLength:
          min: 8
          max: 8
    allOf:
      - label: focused-omitted
        select:
          target: tableCell
          section: Review Handoff
          tableHeader:
            - Review context packet
            - Task fit
            - Status
            - Packet contents
          column: Status
          rowWhere:
            column: Review context packet
            equals: Focused
        assert:
          text:
            contains: OMITTED
          textLength:
            min: 7
            max: 7
      - label: expanded-omitted
        select:
          target: tableCell
          section: Review Handoff
          tableHeader:
            - Review context packet
            - Task fit
            - Status
            - Packet contents
          column: Status
          rowWhere:
            column: Review context packet
            equals: Expanded
        assert:
          text:
            contains: OMITTED
          textLength:
            min: 7
            max: 7

  - id: review.handoff.expanded-selected-when-expanded
    when:
      select:
        target: tableCell
        section: Estimation Inputs
        tableHeader:
          - Field
          - Value
          - Notes
        column: Value
        rowWhere:
          column: Field
          equals: reviewContextSize
      assert:
        text:
          contains: expanded
        textLength:
          min: 8
          max: 8
    select:
      target: tableCell
      section: Review Handoff
      tableHeader:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
      column: Status
      rowWhere:
        column: Review context packet
        equals: Expanded
    assert:
      text:
        contains: SELECTED
      textLength:
        min: 8
        max: 8

  - id: review.handoff.omitted-when-expanded
    when:
      select:
        target: tableCell
        section: Estimation Inputs
        tableHeader:
          - Field
          - Value
          - Notes
        column: Value
        rowWhere:
          column: Field
          equals: reviewContextSize
      assert:
        text:
          contains: expanded
        textLength:
          min: 8
          max: 8
    allOf:
      - label: focused-omitted
        select:
          target: tableCell
          section: Review Handoff
          tableHeader:
            - Review context packet
            - Task fit
            - Status
            - Packet contents
          column: Status
          rowWhere:
            column: Review context packet
            equals: Focused
        assert:
          text:
            contains: OMITTED
          textLength:
            min: 7
            max: 7
      - label: standard-omitted
        select:
          target: tableCell
          section: Review Handoff
          tableHeader:
            - Review context packet
            - Task fit
            - Status
            - Packet contents
          column: Status
          rowWhere:
            column: Review context packet
            equals: Standard
        assert:
          text:
            contains: OMITTED
          textLength:
            min: 7
            max: 7

  - id: review.handoff.focused-size
    when:
      select:
        target: tableCell
        section: Review Handoff
        tableHeader:
          - Review context packet
          - Task fit
          - Status
          - Packet contents
        column: Status
        rowWhere:
          column: Review context packet
          equals: Focused
      assert:
        text:
          contains: SELECTED
        textLength:
          min: 8
          max: 8
    select:
      target: tableCell
      section: Review Handoff
      tableHeader:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
      column: Packet contents
      rowWhere:
        column: Review context packet
        equals: Focused
    assert:
      textLength:
        min: 160
        max: 900

  - id: review.handoff.standard-size
    when:
      select:
        target: tableCell
        section: Review Handoff
        tableHeader:
          - Review context packet
          - Task fit
          - Status
          - Packet contents
        column: Status
        rowWhere:
          column: Review context packet
          equals: Standard
      assert:
        text:
          contains: SELECTED
        textLength:
          min: 8
          max: 8
    select:
      target: tableCell
      section: Review Handoff
      tableHeader:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
      column: Packet contents
      rowWhere:
        column: Review context packet
        equals: Standard
    assert:
      textLength:
        min: 250
        max: 1400

  - id: review.handoff.expanded-size
    when:
      select:
        target: tableCell
        section: Review Handoff
        tableHeader:
          - Review context packet
          - Task fit
          - Status
          - Packet contents
        column: Status
        rowWhere:
          column: Review context packet
          equals: Expanded
      assert:
        text:
          contains: SELECTED
        textLength:
          min: 8
          max: 8
    select:
      target: tableCell
      section: Review Handoff
      tableHeader:
        - Review context packet
        - Task fit
        - Status
        - Packet contents
      column: Packet contents
      rowWhere:
        column: Review context packet
        equals: Expanded
    assert:
      textLength:
        min: 400
        max: 2200

  - id: plan.viability.review.table
    select:
      target: table
      section: Plan Viability Review
      header:
        - Review area
        - Viability question
        - Reviewer notes
        - Decision
        - Required revision
    assert:
      tableColumnsRequired:
        columns:
          - Review area
          - Viability question
          - Reviewer notes
          - Decision
          - Required revision

  - id: plan.viability.required-question.source-authority
    select:
      target: document
    assert:
      text:
        contains: "Are all material sources loaded or explicitly marked as missing?"

  - id: plan.viability.required-question.route-feasibility
    select:
      target: document
    assert:
      text:
        contains: "Can the route be executed with current access, dependencies, and constraints?"

  - id: plan.viability.required-question.dependency-order
    select:
      target: document
    assert:
      text:
        contains: "Are prerequisite inspections, changes, and validations sequenced before dependent work?"

  - id: plan.viability.required-question.validation-evidence
    select:
      target: document
    assert:
      text:
        contains: "Can the validation gates prove the intended outcome objectively?"

  - id: plan.viability.required-question.estimation-readiness
    select:
      target: document
    assert:
      text:
        contains: "Can execution sizing derive proposal or diff inputs from the plan?"

  - id: plan.viability.required-question.execution-commitment
    select:
      target: document
    assert:
      text:
        contains: "Is the plan ready to use as execution context without hidden blockers?"

  - id: unresolved.placeholders.excluded
    select:
      target: document
    assert:
      text:
        excludes:
          - "TODO"
          - "replace-with-command-or-manual-check"
          - "/absolute/path"
          - "/absolute/path/or/repo/relative/path"
          - "<skill-dir>"
          - "<plan-id>"
          - "<target-repo>"
          - "<repo-root>"
          - "Summarize the intended route"
          - "State the concrete completion outcome"
          - "Explain why this path is part of the route"
